[project]
name = "covertext"
version = "0.1.0"
description = "Linguistic steganography and steganalysis in small language models"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "datasets==5.0.1",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.9",
    "accelerate==1.15.0",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
covertext = "covertext.demo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load the model or download data",
]
